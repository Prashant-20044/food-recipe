version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CONNECTION_STRING=mongodb://mongo:27017/foodrecipe
      # You can add other env vars from your .env here
      - SECRET_KEY=KIRTI12345
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/food-app
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
